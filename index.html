<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartWater NL - Visplanner Pro</title>
    
    <!-- Leaflet CSS voor de kaart -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f6fa; overflow: hidden; }
        
        /* Login Scherm */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; padding: 20px; box-sizing: border-box; }
        .login-box { background: #34495e; padding: 30px 20px; border-radius: 12px; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: none; border-radius: 6px; font-size: 16px; text-align: center; box-sizing: border-box; }
        .login-box button { background: #3498db; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; }
        #login-error { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }
        
        /* App Layout */
        .app-container { display: none; flex-direction: column; height: 100vh; }
        #control-panel { padding: 10px; background: #2c3e50; text-align: center; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        /* Categorie & Vis Categorie Knoppen */
        .category-buttons { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .btn-cat { flex: 1; min-width: 60px; padding: 8px 4px; font-size: 13px; font-weight: bold; border: 2px solid #34495e; border-radius: 6px; background: #34495e; color: #ecf0f1; cursor: pointer; }
        .btn-cat.active { background: #3498db; border-color: #2980b9; color: white; }
        
        .species-buttons { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
        .btn-species { background: #1a252f; border: 1px solid #3498db; color: #ecf0f1; padding: 6px 12px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-species.active { background: #e67e22; border-color: #d35400; color: white; }
        
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        
        /* Dashboard Paneel */
        #dashboard { padding: 15px; background: white; max-height: 45%; overflow-y: auto; border-top-left-radius: 16px; border-top-right-radius: 16px; z-index: 1000; box-shadow: 0 -3px 10px rgba(0,0,0,0.15); }
        #dashboard h3 { margin: 0 0 10px 0; color: #2c3e50; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .btn-location { background: #2ecc71; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        #status-text { color: #7f8c8d; font-style: italic; text-align: center; margin: 15px 0; }
        
        .tip-box { background: #f8f9fa; padding: 10px 12px; margin-top: 8px; border-left: 5px solid #3498db; border-radius: 6px; font-size: 13px; color: #333; }
        .tip-box.rules { border-left-color: #e67e22; background: #fff8f0; }
        .tip-box strong { color: #2c3e50; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <!-- Login Scherm -->
    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 SmartWater NL</h2>
            <input type="password" id="password-input" placeholder="Wachtwoord...">
            <button id="login-btn">Inloggen</button>
            <p id="login-error">Onjuist wachtwoord.</p>
        </div>
    </div>

    <!-- Hoofd Applicatie -->
    <div class="app-container" id="main-app">
        <div id="control-panel">
            <!-- Categorie Knoppen -->
            <div class="category-buttons">
                <button class="btn-cat active" onclick="selectCategory('roofvis', this)">Roofvis 🐊</button>
                <button class="btn-cat" onclick="selectCategory('witvis', this)">Witvis 🐟</button>
                <button class="btn-cat" onclick="selectCategory('karper', this)">Karper 🐢</button>
                <button class="btn-cat" onclick="selectCategory('forel', this)">Forel 🌈</button>
                <button class="btn-cat" onclick="selectCategory('paling', this)">Paling 🐍</button>
            </div>

            <!-- Subcategorieën (Vissoorten) -->
            <div id="sub-species-panel" class="species-buttons">
                <!-- Dynamisch gevuld via JS -->
            </div>
        </div>

        <div id="map"></div>

        <div id="dashboard">
            <h3>
                <span>🎣 Live Advies & Regels</span>
                <button class="btn-location" onclick="useCurrentLocation()">📍 Mijn Locatie</button>
            </h3>
            <p id="status-text">Tik op de kaart of gebruik 'Mijn Locatie'...</p>
            <div id="advice-content" style="display:none;">
                <div class="tip-box rules">
                    <strong>⚖️ Reglement & Wetgeving:</strong> 
                    <span id="rules-info">-</span>
                </div>
                <div class="tip-box">
                    <strong>🌤️ Weer lokaal:</strong> 
                    <span id="weather-info">-</span>
                </div>
                <div class="tip-box">
                    <strong>📍 Beste Hotspots Nu:</strong> 
                    <span id="hotspot-info">-</span>
                </div>
                <div class="tip-box">
                    <strong>🪱 Materiaal & Aas:</strong> 
                    <span id="tackle-info">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map, currentLat, currentLng, activeMarker = null;
        let selectedCategory = 'roofvis';
        let selectedFish = 'Snoek';

        // Uitgebreide datastructuur inclusief Regels & Minimummaten
        const fishData = {
            roofvis: {
                sub: ['Snoek', 'Snoekbaars', 'Baars'],
                advice: {
                    'Snoek': { 
                        min: "45 cm", 
                        closed: "1 maart t/m laatste zaterdag van april", 
                        hs: "Overgang diep/ondiep (taluds), plantenbedden en rietkragen.", 
                        tc: "Grote shads (15-20cm), jerkbaits of takel met dood aas. Stalen onderlijn verplicht!" 
                    },
                    'Snoekbaars': { 
                        min: "42 cm", 
                        closed: "1 maart t/m laatste zaterdag van mei", 
                        hs: "Diepe gaten (4-8m), schaduw van bruggen, troebel of stromend water.", 
                        tc: "Shad met stinger strak over de bodem gevist of dropshot montage." 
                    },
                    'Baars': { 
                        min: "22 cm", 
                        closed: "1 april t/m laatste zaterdag van mei", 
                        hs: "Harde bodems, mosselbanken, steigers, damwanden en bruggen.", 
                        tc: "Carolina rig, kleine plugjes of shads (5-7cm)." 
                    }
                }
            },
            witvis: {
                sub: ['Voorn', 'Brasem', 'Blei', 'Zeelt', 'Winde'],
                advice: {
                    'Voorn': { 
                        min: "15 cm (Ruisvoorn)", 
                        closed: "Geen landelijke gesloten tijd (Let op: Ruisvoorn 1 apr - laatste za mei)", 
                        hs: "Lichte stroming, havens, bruggen en rietkragen.", 
                        tc: "Maden, casters of kleine hennep-korrels met lichte dobbermontage." 
                    },
                    'Brasem': { 
                        min: "Geen minimummaat", 
                        closed: "Geen gesloten tijd", 
                        hs: "Diepe, rustige zones en zachte bodems/slib.", 
                        tc: "Voerkorf (feeder) met zoet voer, maïs, pieren of mini-boilies." 
                    },
                    'Blei': { 
                        min: "Geen minimummaat", 
                        closed: "Geen gesloten tijd", 
                        hs: "Traag stromend water, kanaalvakken en havens.", 
                        tc: "Lichte feeder of vaste hengel met pinkies en maden." 
                    },
                    'Zeelt': { 
                        min: "Geen minimummaat", 
                        closed: "Geen gesloten tijd (terugzetadvies geldt lokaal)", 
                        hs: "Dichtbegroeid water, lelievelden en zachte bodems.", 
                        tc: "Vroege ochtend/avond met maïs, pieren of deeg vlak bij planten." 
                    },
                    'Winde': { 
                        min: "30 cm", 
                        closed: "1 april t/m laatste zaterdag van mei", 
                        hs: "Snelstromend water, stroomversnellingen en kribben.", 
                        tc: "Spinners, vliegvissen of drijvend brood aan het oppervlak." 
                    }
                }
            },
            karper: {
                sub: [],
                advice: {
                    'Karper': { 
                        min: "Geen minimummaat", 
                        closed: "Geen gesloten tijd", 
                        hs: "Eilanden, rietkragen, lelievelden en luwe hoeken van het water.", 
                        tc: "Boilies, tijgernoten of pellet-rigs met een vastlood-systeem." 
                    }
                }
            },
            forel: {
                sub: [],
                advice: {
                    'Forel': { 
                        min: "25 cm (Beekforel)", 
                        closed: "1 oktober t/m 31 maart (Beekforel)", 
                        hs: "Stromend, zuurstofrijk en helder water.", 
                        tc: "Powerbait deeg, kleine spintellers of micro-spoons." 
                    }
                }
            },
            paling: {
                sub: [],
                advice: {
                    'Paling': { 
                        min: "ALTIJD TERUGZETTEN (Meeneemverbod)", 
                        closed: "N.v.t. - Paling heeft algehele beschermde status in NL", 
                        hs: "Obstakels, diepe holen, beschoeiingen en 's nachts op ondieptes.", 
                        tc: "Gevangen paling dient direct onbeschadigd te worden teruggezet." 
                    }
                }
            }
        };

        // DOM Load handler
        document.addEventListener("DOMContentLoaded", function() {
            const loginBtn = document.getElementById('login-btn');
            const pwdInput = document.getElementById('password-input');

            loginBtn.addEventListener('click', checkPassword);
            pwdInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkPassword();
            });

            // Initialiseer categorie
            selectCategory('roofvis', document.querySelector('.btn-cat'));
        });

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === "roofvis2026") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                
                setTimeout(initMap, 100);
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function initMap() {
            if (!map) {
                map = L.map('map', { zoomControl: false }).setView([52.0907, 5.1214], 8);
                L.control.zoom({ position: 'bottomright' }).addTo(map);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                    attribution: '© OpenStreetMap' 
                }).addTo(map);

                map.on('click', function(e) { 
                    handleLocationSelect(e.latlng.lat, e.latlng.lng); 
                });
            }
            map.invalidateSize();
        }

        function selectCategory(category, btnElement) {
            selectedCategory = category;
            
            document.querySelectorAll('.btn-cat').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            const subPanel = document.getElementById('sub-species-panel');
            subPanel.innerHTML = '';

            const speciesList = fishData[category].sub;

            if (speciesList.length > 0) {
                speciesList.forEach((fish, index) => {
                    const btn = document.createElement('button');
                    btn.className = `btn-species ${index === 0 ? 'active' : ''}`;
                    btn.innerText = fish;
                    btn.onclick = () => selectSubSpecies(fish, btn);
                    subPanel.appendChild(btn);
                });
                selectedFish = speciesList[0];
            } else {
                selectedFish = category.charAt(0).toUpperCase() + category.slice(1);
            }

            if (currentLat && currentLng) handleLocationSelect(currentLat, currentLng);
        }

        function selectSubSpecies(fish, btnElement) {
            selectedFish = fish;
            document.querySelectorAll('.btn-species').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            if (currentLat && currentLng) handleLocationSelect(currentLat, currentLng);
        }

        function useCurrentLocation() {
            if (navigator.geolocation) {
                document.getElementById('status-text').style.display = 'block';
                document.getElementById('status-text').innerText = "Locatie zoeken via GPS...";
                navigator.geolocation.getCurrentPosition(function(pos) {
                    map.setView([pos.coords.latitude, pos.coords.longitude], 13);
                    handleLocationSelect(pos.coords.latitude, pos.coords.longitude);
                }, function() { 
                    alert("GPS mislukt. Zorg dat locatietoegang aan staat of tik handmatig op de kaart."); 
                });
            }
        }

        function handleLocationSelect(lat, lng) {
            currentLat = lat; 
            currentLng = lng;
            
            if (activeMarker) { 
                activeMarker.setLatLng([lat, lng]); 
            } else { 
                activeMarker = L.marker([lat, lng]).addTo(map); 
            }

            document.getElementById('status-text').style.display = 'block';
            document.getElementById('advice-content').style.display = 'none';
            document.getElementById('status-text').innerText = "Weer- & hengelsportdata berekenen...";
            
            getWeatherData(lat, lng);
        }

        function getWeatherData(lat, lng) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    let w = data.current;
                    let bft = Math.min(7, Math.floor(w.wind_speed_10m / 7));
                    let txt = `${w.temperature_2m}°C met windkracht ${bft} Bft (${Math.round(w.wind_speed_10m)} km/u).`;

                    let adv = fishData[selectedCategory].advice[selectedFish] || { 
                        min: "Onbekend", closed: "Onbekend", hs: "Geen specifieke data.", tc: "Standaard montage." 
                    };

                    document.getElementById('status-text').style.display = 'none';
                    document.getElementById('advice-content').style.display = 'block';
                    
                    // Vul informatie in
                    document.getElementById('rules-info').innerHTML = `<strong>${selectedFish}</strong> — Min. maat: <u>${adv.min}</u> | Gesloten tijd: <u>${adv.closed}</u>`;
                    document.getElementById('weather-info').innerText = txt;
                    document.getElementById('hotspot-info').innerText = adv.hs;
                    document.getElementById('tackle-info').innerText = adv.tc;
                })
                .catch(err => { 
                    console.error(err);
                    document.getElementById('status-text').innerText = "Fout bij ophalen van data."; 
                });
        }
    </script>
</body>
</html>
