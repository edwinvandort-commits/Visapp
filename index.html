<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartWater NL - Indicatief Visadvies</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-orange: #fb923c;
            --border-color: #334155;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #map {
            flex: 1;
            width: 100%;
        }

        #dashboard {
            padding: 16px;
            background: var(--bg-card);
            max-height: 45vh;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .advice-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .badge {
            font-size: 11px;
            background: #334155;
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-blue);
        }

        .warning-box {
            background: #451a1a;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .score-breakdown {
            font-size: 12px;
            margin-top: 8px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        button.retry-btn {
            background: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="dashboard">
        <div id="dashboard-content">
            <p style="margin:0; font-size:14px; color:#94a3b8;">
                Klik op een water op de kaart om de <b>Indicatieve weerscore</b> en locatie-adviezen te bekijken.
            </p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Onze logica -->
    <script src="app.js"></script>
</body>
</html>
