<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartWater NL - Roofvis App</title>
    <!-- Leaflet CSS voor de kaart -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        /* Basisinstellingen voor mobiel */
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f6fa;
            overflow: hidden;
        }

        /* WACHTWOORD SCHERM STYLING */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box {
            background: #34495e;
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 100%;
        }

        .login-box h2 {
            margin-top: 0;
            font-size: 22px;
            color: #fff;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
            background-color: white;
            color: black;
        }

        .login-box button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        #login-error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }

        /* Hoofdcontainer van de app (standaard verborgen) */
        .app-container {
            display: none;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
        }

        /* Bovenbalk met grote knoppen */
        #control-panel { 
            padding: 12px; 
            background: #2c3e50; 
            color: white; 
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        
        #control-panel p {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #bdc3c7;
        }

        .species-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn-species {
            flex: 1;
            max-width: 110px;
            padding: 12px 5px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #34495e;
            border-radius: 8px;
            background: #34495e;
            color: #ecf0f1;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-species.active {
            background: #3498db;
            border-color: #2980b9;
            color: white;
            transform: scale(1.03);
        }

        #map { 
            flex-grow: 1; 
            width: 100%; 
            z-index: 1;
        }

        #dashboard { 
            padding: 15px; 
            background: white; 
            max-height: 40%; 
            overflow-y: auto; 
            box-shadow: 0 -3px 10px rgba(0,0,0,0.15);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 1000;
        }

        #dashboard h3 { 
            margin: 0 0 10px 0; 
            color: #2c3e50; 
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-location {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        #status-text {
            color: #7f8c8d;
            font-style: italic;
            margin: 10px 0;
            text-align: center;
        }

        .tip-box { 
            background: #f8f9fa; 
            padding: 12px; 
            margin-top: 10px; 
            border-left: 5px solid #3498db; 
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .tip-box strong {
            color: #2c3e50;
            display: block;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <!-- WACHTWOORD INVOERSCHERM -->
    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 SmartWater NL</h2>
            <p style="color: #bdc3c7; font-size: 14px; margin: 0;">Voer het test-wachtwoord in:</p>
            <input type="password" id="password-input" placeholder="Wachtwoord...">
            <button onclick="checkPassword()">Inloggen</button>
            <p id="login-error">Onjuist wachtwoord. Probeer opnieuw.</p>
        </div>
    </div>

    <!-- HOOFD APP CONTAINER -->
    <div class="app-container" id="main-app">
        <!-- 1. Bovenbalk -->
        <div id="control-panel">
            <p>Ik vis vandaag op:</p>
            <div class="species-buttons">
                <button class="btn-species active" onclick="selectSpecies('baars')">Baars 🐟</button>
                <button class="btn-species" onclick="selectSpecies('snoek')">Snoek 🐊</button>
                <button class="btn-species" onclick="selectSpecies('snoekbaars')">Snoekbaars 🦇</button>
            </div>
        </div>

        <!-- 2. De Kaart -->
        <div id="map"></div>

        <!-- 3. Dashboard -->
        <div id="dashboard">
            <h3>
                <span>🎣 Live Advies</span>
                <button class="btn-location" onclick="useCurrentLocation()">📍 Mijn Locatie</button>
            </h3>
            
            <p id="status-text">Tik op de kaart of gebruik 'Mijn Locatie'...</p>
            
            <div id="advice-content" style="display:none;">
                <div class="tip-box"><strong>Weer lokaal:</strong> <span id="weather-info">-</span></div>
                <div class="tip-box"><strong>Beste Hotspots Nu:</strong> <span id="hotspot-info">-</span></div>
                <div class="tip-box"><strong>Materiaal & Aas:</strong> <span id="tackle-info">-</span></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS voor de kaart -->
    <script src="https://unpkg.com"></script>
    <script>
        // --- WACHTWOORD LOGICA ---
        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const correctPassword = "roofvis2026";

            if (input === correctPassword) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                initMap();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // --- KAART EN VIS LOGICA ---
        let map, currentLat, currentLng;
        let activeMarker = null;
        let selectedSpecies = 'baars';

        function initMap() {
            if (!map) {
                map = L.map('map', { zoomControl: false }).setView([52.0907, 5.1214], 8);
                L.control.zoom({ position: 'bottomright' }).addTo(map);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                map.on('click', function(e) {
                    handleLocationSelect(e.latlng.lat, e.latlng.lng);
                });
            }
        }

        function useCurrentLocation() {
            if (navigator.geolocation) {
                document.getElementById('status-text').innerText = "Locatie zoeken via GPS...";
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 13);
                    handleLocationSelect(lat, lng);
                }, function(error) {
                    alert("Kan je locatie niet ophalen. Tik handmatig op de kaart.");
                    document.getElementById('status-text').innerText = "Tik op de kaart...";
                });
            } else {
                alert("GPS wordt niet ondersteund door deze browser.");
            }
        }

        function handleLocationSelect(lat, lng) {
            currentLat = lat;
            currentLng = lng;
            if (activeMarker) {
                activeMarker.setLatLng([lat, lng]);
            } else {
                activeMarker = L.marker([lat, lng]).addTo(map);
            }
            document.getElementById('status-text').style.display = 'block';
