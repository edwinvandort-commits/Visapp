<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartWater NL - Roofvis App</title>
    <!-- De Kaartstijlen -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, sans-serif; background: #f5f6fa; overflow: hidden; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; padding: 20px; box-sizing: border-box; }
        .login-box { background: #34495e; padding: 30px 20px; border-radius: 12px; text-align: center; max-width: 320px; width: 100%; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: none; border-radius: 6px; font-size: 16px; text-align: center; }
        .login-box button { background: #3498db; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; }
        #login-error { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }
        .app-container { display: none; flex-direction: column; height: 100vh; }
        #control-panel { padding: 12px; background: #2c3e50; text-align: center; z-index: 1000; }
        .species-buttons { display: flex; gap: 8px; justify-content: center; }
        .btn-species { flex: 1; max-width: 110px; padding: 12px 5px; font-size: 14px; font-weight: bold; border: 2px solid #34495e; border-radius: 8px; background: #34495e; color: #ecf0f1; cursor: pointer; }
        .btn-species.active { background: #3498db; border-color: #2980b9; color: white; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        #dashboard { padding: 15px; background: white; max-height: 40%; overflow-y: auto; border-top-left-radius: 16px; border-top-right-radius: 16px; z-index: 1000; box-shadow: 0 -3px 10px rgba(0,0,0,0.15); }
        #dashboard h3 { margin: 0 0 10px 0; color: #2c3e50; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .btn-location { background: #2ecc71; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        #status-text { color: #7f8c8d; font-style: italic; text-align: center; }
        .tip-box { background: #f8f9fa; padding: 12px; margin-top: 10px; border-left: 5px solid #3498db; border-radius: 6px; font-size: 14px; }
        .tip-box strong { color: #2c3e50; display: block; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 SmartWater NL</h2>
            <input type="password" id="password-input" placeholder="Wachtwoord...">
            <button onclick="checkPassword()">Inloggen</button>
            <p id="login-error">Onjuist wachtwoord.</p>
        </div>
    </div>
    <div class="app-container" id="main-app">
        <div id="control-panel">
            <div class="species-buttons">
                <button class="btn-species active" onclick="selectSpecies('baars')">Baars 🐟</button>
                <button class="btn-species" onclick="selectSpecies('snoek')">Snoek 🐊</button>
                <button class="btn-species" onclick="selectSpecies('snoekbaars')">Snoekbaars 🦇</button>
            </div>
        </div>
        <div id="map"></div>
        <div id="dashboard">
            <h3><span>🎣 Live Advies</span><button class="btn-location" onclick="useCurrentLocation()">📍 Mijn Locatie</button></h3>
            <p id="status-text">Tik op de kaart of gebruik 'Mijn Locatie'...</p>
            <div id="advice-content" style="display:none;">
                <div class="tip-box"><strong>Weer lokaal:</strong> <span id="weather-info">-</span></div>
                <div class="tip-box"><strong>Beste Hotspots Nu:</strong> <span id="hotspot-info">-</span></div>
                <div class="tip-box"><strong>Materiaal & Aas:</strong> <span id="tackle-info">-</span></div>
            </div>
        </div>
    </div>
    <!-- De Kaartmotor en Logica -->
    <script src="https://unpkg.com"></script>
    <script src="app.js"></script>
</body>
</html>
