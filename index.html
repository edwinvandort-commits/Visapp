<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartWater NL - Roofvis App Pro</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f6fa; overflow: hidden; }
        
        /* Login Scherm */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; padding: 20px; box-sizing: border-box; }
        .login-box { background: #34495e; padding: 30px 20px; border-radius: 12px; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: none; border-radius: 6px; font-size: 16px; text-align: center; box-sizing: border-box; }
        .login-box button { background: #3498db; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; }
        #login-error { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }
        
        /* App Layout */
        .app-container { display: none; flex-direction: column; height: 100vh; }
        #control-panel { padding: 12px; background: #2c3e50; text-align: center; z-index: 1000; }
        .species-buttons { display: flex; gap: 8px; justify-content: center; }
        .btn-species { flex: 1; max-width: 110px; padding: 12px 5px; font-size: 14px; font-weight: bold; border: 2px solid #34495e; border-radius: 8px; background: #34495e; color: #ecf0f1; cursor: pointer; }
        .btn-species.active { background: #3498db; border-color: #2980b9; color: white; }
        
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        
        /* Dashboard Paneel */
        #dashboard { padding: 15px; background: white; max-height: 45%; overflow-y: auto; border-top-left-radius: 16px; border-top-right-radius: 16px; z-index: 1000; box-shadow: 0 -3px 10px rgba(0,0,0,0.15); }
        #dashboard h3 { margin: 0 0 10px 0; color: #2c3e50; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .btn-location { background: #2ecc71; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        #status-text { color: #7f8c8d; font-style: italic; text-align: center; margin: 15px 0; }
        .tip-box { background: #f8f9fa; padding: 12px; margin-top: 10px; border-left: 5px solid #3498db; border-radius: 6px; font-size: 14px; color: #333; }
        .tip-box strong { color: #2c3e50; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <!-- Login Scherm -->
    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 SmartWater NL</h2>
            <input type="password" id="password-input" placeholder="Wachtwoord...">
            <button id="login-btn">Inloggen</button>
            <p id="login-error">Onjuist wachtwoord.</p>
        </div>
    </div>

    <!-- Hoofd Applicatie -->
    <div class="app-container" id="main-app">
        <div id="control-panel">
            <div class="species-buttons">
                <button class="btn-species active" onclick="selectSpecies('baars', this)">Baars 🐟</button>
                <button class="btn-species" onclick="selectSpecies('snoek', this)">Snoek 🐊</button>
                <button class="btn-species" onclick="selectSpecies('snoekbaars', this)">Snoekbaars 🦇</button>
            </div>
        </div>

        <div id="map"></div>

        <div id="dashboard">
            <h3>
                <span>🎣 Live Advies</span>
                <button class="btn-location" onclick="useCurrentLocation()">📍 Mijn Locatie</button>
            </h3>
            <p id="status-text">Tik op de kaart of gebruik 'Mijn Locatie'...</p>
            <div id="advice-content" style="display:none;">
                <div class="tip-box"><strong>Weer lokaal:</strong> <span id="weather-info">-</span></div>
                <div class="tip-box"><strong>Beste Hotspots Nu:</strong> <span id="hotspot-info">-</span></div>
                <div class="tip-box"><strong>Materiaal & Aas:</strong> <span id="tackle-info">-</span></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map, currentLat, currentLng, activeMarker = null, selectedSpecies = 'baars';

        // Event listeners koppelen zodra de pagina geladen is
        document.addEventListener("DOMContentLoaded", function() {
            const loginBtn = document.getElementById('login-btn');
            const pwdInput = document.getElementById('password-input');

            loginBtn.addEventListener('click', checkPassword);
            pwdInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkPassword();
            });
        });

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === "roofvis2026") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                
                // Kort wachten tot het scherm zichtbaar is voordat de kaart wordt getekend
                setTimeout(initMap, 100);
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function initMap() {
            if (!map) {
                map = L.map('map', { zoomControl: false }).setView([52.0907, 5.1214], 8);
                
                L.control.zoom({ position: 'bottomright' }).addTo(map);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                    attribution: '© OpenStreetMap' 
                }).addTo(map);

                map.on('click', function(e) { 
                    handleLocationSelect(e.latlng.lat, e.latlng.lng); 
                });
            }
            // Zorg dat Leaflet de juiste schermgrootte pakt
            map.invalidateSize();
        }

        function useCurrentLocation() {
            if (navigator.geolocation) {
                document.getElementById('status-text').style.display = 'block';
                document.getElementById('status-text').innerText = "Locatie zoeken via GPS...";
                navigator.geolocation.getCurrentPosition(function(pos) {
                    map.setView([pos.coords.latitude, pos.coords.longitude], 13);
                    handleLocationSelect(pos.coords.latitude, pos.coords.longitude);
                }, function() { 
                    alert("GPS mislukt. Zorg dat locatietoegang aan staat of tik handmatig op de kaart."); 
                });
            }
        }

        function handleLocationSelect(lat, lng) {
            currentLat = lat; 
            currentLng = lng;
            
            if (activeMarker) { 
                activeMarker.setLatLng([lat, lng]); 
            } else { 
                activeMarker = L.marker([lat, lng]).addTo(map); 
            }

            document.getElementById('status-text').style.display = 'block';
            document.getElementById('advice-content').style.display = 'none';
            document.getElementById('status-text').innerText = "Weer- & hengelsportdata berekenen...";
            
            getWeatherData(lat, lng);
        }

        function selectSpecies(species, btnElement) {
            selectedSpecies = species;
            document.querySelectorAll('.btn-species').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            if (currentLat && currentLng) { 
                handleLocationSelect(currentLat, currentLng); 
            }
        }

        function getWeatherData(lat, lng) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    let w = data.current;
                    let bft = Math.min(7, Math.floor(w.wind_speed_10m / 7));
                    let txt = `${w.temperature_2m}°C met windkracht ${bft} Bft (${Math.round(w.wind_speed_10m)} km/u).`;
                    let hs = "", tc = "";

                    if (selectedSpecies === "baars") {
                        hs = w.temperature_2m < 10 ? "Diepe gaten, havens of luwte achter peilers. Ligt passief tegen de bodem." : "Actief! Harde bodems, mosselbanken, bruggen en houten palen.";
                        tc = w.temperature_2m < 10 ? "Carolina Rig of kleine shad (5-7cm). Extreem traag vissen met lichte loodkop (3-5g)." : "Kleine plugjes, spinners of crankbaits. Felle kleuren bij bewolking.";
                    } else if (selectedSpecies === "snoek") {
                        hs = w.temperature_2m > 20 ? "Warm water. In de buurt van plantenbedden of in stromend, zuurstofrijk water." : "Ideaal! Richt je op de overgang van diep naar ondiep water (taluds) en rietkragen.";
                        tc = w.temperature_2m > 20 ? "Niet te diep vissen. Grote spinners of chatterbaits die veel trillingen maken werken top." : "Grote shads (15-20cm) of jerkbaits. Gebruik altijd een stalen onderlijn!";
                    } else {
                        hs = "Snoekbaars haat licht. Zoek diep water op (4-8m), troebel water, of schaduw onder grote bruggen.";
                        tc = w.temperature_2m < 12 ? "Dropshot montage met slanke worm-achtige softbait. Beweeg bijna niet." : "Stinger montage op een shad van 10-12cm. Vis strak tegen de bodem aan.";
                    }

                    document.getElementById('status-text').style.display = 'none';
                    document.getElementById('advice-content').style.display = 'block';
                    document.getElementById('weather-info').innerText = txt;
                    document.getElementById('hotspot-info').innerText = hs;
                    document.getElementById('tackle-info').innerText = tc;
                })
                .catch(err => { 
                    console.error(err);
                    document.getElementById('status-text').innerText = "Fout bij ophalen van weerdata."; 
                });
        }
    </script>
</body>
</html>
